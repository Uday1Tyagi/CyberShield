<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Shield Pro</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    background: #080810;
    color: #e8e6f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 13px;
  }

  /* header */
  .hdr {
    display: flex; align-items: center; gap: 8px;
    padding: 13px 15px 11px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .hdr-logo {
    width: 28px; height: 28px; border-radius: 8px;
    background: linear-gradient(135deg,#6366f1,#a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #fff; font-weight: 700;
  }
  .hdr-title { font-weight: 700; font-size: 14px; }
  .hdr-sub   { font-size: 10px; color: rgba(255,255,255,0.35); }

  /* flask status */
  .flask-status {
    display: flex; align-items: center; gap: 6px;
    margin: 10px 12px 0;
    padding: 7px 10px;
    border-radius: 8px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.07);
    font-size: 11px; color: rgba(255,255,255,0.5);
  }
  .flask-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-on  { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
  .dot-off { background: #ef4444; }

  /* verdict card */
  .card {
    margin: 10px 12px;
    border-radius: 12px;
    padding: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.04);
  }
  .card-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.3); margin-bottom: 8px; }
  .verdict-row { display: flex; align-items: center; gap: 10px; }
  .v-icon {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700; flex-shrink: 0;
  }
  .v-safe       .v-icon { background: rgba(34,197,94,0.15);  color: #4ade80; border: 1.5px solid rgba(34,197,94,0.35); }
  .v-suspicious .v-icon { background: rgba(245,158,11,0.15); color: #fbbf24; border: 1.5px solid rgba(245,158,11,0.35); }
  .v-dangerous  .v-icon { background: rgba(239,68,68,0.15);  color: #f87171; border: 1.5px solid rgba(239,68,68,0.35); }
  .v-scanning   .v-icon { background: rgba(99,102,241,0.15); color: #818cf8; border: 1.5px solid rgba(99,102,241,0.35); animation: spin 0.8s linear infinite; }
  .v-title { font-weight: 700; font-size: 15px; }
  .v-safe       .v-title { color: #4ade80; }
  .v-suspicious .v-title { color: #fbbf24; }
  .v-dangerous  .v-title { color: #f87171; }
  .v-scanning   .v-title { color: #818cf8; }
  .v-url { font-size: 11px; color: rgba(255,255,255,0.35); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 200px; margin-top: 2px; }

  /* score bar */
  .score-wrap { margin-top: 12px; }
  .score-lbl  { display: flex; justify-content: space-between; font-size: 10px; color: rgba(255,255,255,0.3); margin-bottom: 5px; }
  .score-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
  .score-fill  { height: 100%; border-radius: 99px; transition: width 0.6s cubic-bezier(.16,1,.3,1); }

  /* signals */
  .sigs { margin: 0 12px 10px; }
  .sigs-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.3); margin-bottom: 6px; }
  .sig {
    display: flex; align-items: flex-start; gap: 7px;
    padding: 6px 9px; border-radius: 7px;
    background: rgba(255,255,255,0.04);
    margin-bottom: 4px; font-size: 11px;
    color: rgba(255,255,255,0.6); line-height: 1.4;
    border: 1px solid rgba(255,255,255,0.05);
  }
  .sig-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
  .d-danger { background: #ef4444; }
  .d-warn   { background: #f59e0b; }
  .d-safe   { background: #22c55e; }

  /* history */
  .hist-sec  { border-top: 1px solid rgba(255,255,255,0.07); padding: 9px 12px 12px; }
  .hist-lbl  { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.3); margin-bottom: 7px; }
  .hist-item { display: flex; align-items: center; gap: 7px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
  .hist-item:last-child { border-bottom: none; }
  .h-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .h-url { flex: 1; font-size: 11px; color: rgba(255,255,255,0.45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .h-badge { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; flex-shrink: 0; }
  .hb-safe       { background: rgba(34,197,94,0.12);  color: #4ade80; }
  .hb-suspicious { background: rgba(245,158,11,0.12); color: #fbbf24; }
  .hb-dangerous  { background: rgba(239,68,68,0.12);  color: #f87171; }

  .loading { padding: 28px; text-align: center; color: rgba(255,255,255,0.3); font-size: 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-logo">🛡</div>
  <div>
    <div class="hdr-title">URL Shield Pro</div>
    <div class="hdr-sub">Python Flask + Chrome Extension</div>
  </div>
</div>

<!-- Flask status -->
<div class="flask-status">
  <div class="flask-dot" id="flaskDot"></div>
  <span id="flaskStatus">Checking Flask API...</span>
</div>

<!-- Current site -->
<div id="mainContent">
  <div class="loading">Loading scan result...</div>
</div>

<!-- History -->
<div id="histSection" style="display:none">
  <div class="hist-sec">
    <div class="hist-lbl">Recent scans</div>
    <div id="histList"></div>
  </div>
</div>

<script src="popup.js"></script>
</body>
</html>
